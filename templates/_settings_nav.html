<nav class="admin-subtabs settings-subtabs v215-settings-tabs" aria-label="Navigation des réglages">{% for item in settings_navigation %}<a class="admin-subtab{% if item.active %} active{% endif %}" href="{{ item.url }}" {% if item.active %}aria-current="page"{% endif %}>{{ _(item.label) }}</a>{% endfor %}</nav>
{% if settings_secondary %}<nav class="v215-settings-secondary" aria-label="Sections du réglage">{% for item in settings_secondary %}<a class="admin-button {{ 'primary' if item.active else 'secondary' }} compact" href="{{ item.url }}">{{ _(item.label) }}</a>{% endfor %}</nav>{% endif %}
