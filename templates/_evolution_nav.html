<nav class="admin-subtabs" aria-label="Ressources et compétences">
  <a class="admin-subtab{% if request.endpoint=='admin_services' %} active{% endif %}" href="{{ url_for('admin_services') }}">Aperçu</a>
  {% if modules.resources %}
  <a class="admin-subtab{% if request.endpoint=='evolution.resource_bookings' %} active{% endif %}" href="{{ url_for('evolution.resource_bookings') }}">Réserver une ressource</a>
  {% endif %}
  {% if modules.resources or maintenance_enabled %}
  <a class="admin-subtab{% if request.endpoint in ('evolution.resource_directory','resource_portal.page') %} active{% endif %}" href="{{ url_for('evolution.resource_directory') }}">Ressources</a>
  {% endif %}
  {% if modules.authorizations %}
  <a class="admin-subtab{% if request.endpoint=='evolution.authorizations' %} active{% endif %}" href="{{ url_for('evolution.authorizations') }}">Formations et habilitations</a>
  {% endif %}
</nav>
